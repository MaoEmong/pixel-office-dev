<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>픽셀 오피스 · 원격</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header><a class="brand" href="/">▦ 픽셀 오피스 <small>원격</small></a><span id="connection" role="status">연결 준비</span></header>
<main>
 <section id="pairing" class="card"><p class="eyebrow">기기 연결</p><h1>내 작업 PC와 연결하기</h1><p>작업 PC에서 만든 QR을 스캔하거나 연결 키를 입력하세요.<br>PC에서 승인하면 다음부터 자동으로 연결됩니다.</p>
  <form id="pair-form"><label for="device-name">이 기기 이름</label><input id="device-name" autocomplete="off" maxlength="80" placeholder="예: 내 휴대폰" required><label for="pair-code">연결 키</label><input id="pair-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="PC 화면에서 연결 키를 복사하세요" required><button id="pair-submit" class="primary" disabled>등록 요청</button></form>
  <p id="pair-message" role="status"></p><p id="fingerprint" class="mono"></p><p class="muted">계정이나 로그인이 필요하지 않습니다. 작업 기록은 PC에 저장됩니다.</p>
 </section>
 <div id="workspace" hidden>
  <div class="toolbar"><label for="department">작업 부서</label><select id="department"></select><button id="refresh">새로고침</button><button id="device-menu">이 기기</button></div>
  <div id="empty" class="card" hidden>PC에서 프로젝트 부서를 만들면 여기에 표시됩니다.</div>
  <div class="layout"><section class="office card"><div class="section-title"><h2>사무실</h2><span id="office-summary"></span></div><div class="floor"><canvas id="office-canvas" width="680" height="280" aria-label="부장과 팀장·팀원의 작업 상태"></canvas></div><div id="members" class="member-grid"></div></section>
   <section class="card inbox"><div class="section-title"><h2>내 승인함</h2><span id="pending-count"></span></div><div id="inbox"></div></section>
   <section class="card workflow"><div class="section-title"><h2>대화 · 회의 · 작업</h2><span id="phase"></span></div><div id="workflow-body"></div>
    <form id="discuss-form"><label for="task-text">부장에게 이야기하기</label><textarea id="task-text" rows="3" placeholder="목표, 범위, 완료 기준을 이야기하세요. 대화 전송만으로 구현을 시작하지 않습니다." maxlength="30000"></textarea><button id="discuss" class="primary">대화 보내기</button></form>
    <div id="workflow-actions" class="actions"></div>
   </section>
   <section class="card reports"><div class="section-title"><h2>보고 · 작업 로그</h2><select id="log-member" aria-label="로그를 확인할 멤버"></select></div><div id="logs"></div></section>
  </div>
 </div>
 <section id="device-panel" class="card" hidden><h2>이 기기의 연결</h2><p id="device-details"></p><p>등록은 한쪽에서 연결을 해제할 때까지 유지됩니다. 화면을 닫아도 PC의 작업은 계속됩니다.</p><button id="disconnect-device" class="danger">이 기기 연결 해제</button><button id="device-close">닫기</button></section>
 <p id="error" role="alert"></p>
</main><footer>작업 파일·세션·회의록은 작업 PC에 저장됩니다.</footer>
</body></html>
